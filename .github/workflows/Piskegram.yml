name: Deploy PiskeGram to private EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PATH: /home/ubuntu/Sample-socialmedia-app-test
  DEPLOY_USER: ubuntu

jobs:
  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          test -n "$APP_ENV_FILE"
          printf '%s\n' "$APP_ENV_FILE" > .env
          chmod 600 .env
          grep -Eq '^S3_BUCKET=[^[:space:]]+$' .env || {
            echo "APP_ENV_FILE must define S3_BUCKET for image uploads."
            exit 1
          }

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: piskegram-app:ci
          load: true
          cache-from: type=gha,scope=piskegram-app
          cache-to: type=gha,mode=max,scope=piskegram-app

      - name: Package validated source
        run: |
          tar --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            -czf "$RUNNER_TEMP/piskegram-source.tar.gz" .
          cp "$RUNNER_TEMP/piskegram-source.tar.gz" ./piskegram-source.tar.gz

      - name: Upload validated source artifact
        uses: actions/upload-artifact@v4
        with:
          name: piskegram-source-${{ github.sha }}
          path: piskegram-source.tar.gz
          retention-days: 7

  deploy:
    name: Deploy through bastion
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download validated source artifact
        uses: actions/download-artifact@v4
        with:
          name: piskegram-source-${{ github.sha }}

      - name: Extract validated source
        run: |
          mkdir -p release
          tar -xzf piskegram-source.tar.gz -C release
          cd release
          test -f docker-compose.yml
          test -f Dockerfile

      - name: Create deployment environment file
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          test -n "$APP_ENV_FILE"
          printf '%s\n' "$APP_ENV_FILE" > .env
          chmod 600 .env
          grep -Eq '^S3_BUCKET=[^[:space:]]+$' .env || {
            echo "APP_ENV_FILE must define S3_BUCKET for image uploads."
            exit 1
          }

      - name: Install SSH tools
        run: apt-get update && apt-get install --yes rsync

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets['EC2_SSH_PASSPHRASE'] }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$BASTION_HOST"
          test -n "$PRIVATE_HOST"
          BASTION_HOST="$(printf '%s' "$BASTION_HOST" | tr -d '\r\n')"
          PRIVATE_HOST="$(printf '%s' "$PRIVATE_HOST" | tr -d '\r\n')"
          for host in "$BASTION_HOST" "$PRIVATE_HOST"; do
            if [[ ! "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ && ! "$host" =~ ^[A-Za-z0-9.-]+$ ]]; then
              echo "Host secret values must contain only an IPv4 address or DNS hostname. Set the secret name separately; do not include BASTION_HOST=, ssh, ubuntu@, URLs, quotes, ports, or labels."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g; s/\r$//' > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host bastion
            HostName $BASTION_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts

          Host private-ec2
            HostName $PRIVATE_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyJump bastion
          EOF
          chmod 600 ~/.ssh/config
          eval "$(ssh-agent -s)"
          if [[ -n "$SSH_PASSPHRASE" ]]; then
            printf '%s\n' "$SSH_PASSPHRASE" | ssh-add ~/.ssh/deploy_key
          else
            ssh-add ~/.ssh/deploy_key
          fi
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "Deployment key fingerprint: $(ssh-add -L | ssh-keygen -lf - | awk '{print $2}')"
          ssh-keyscan -4 -T 10 -H "$BASTION_HOST" >> ~/.ssh/known_hosts
          ssh bastion "ssh-keyscan -4 -T 10 -H '$PRIVATE_HOST'" >> ~/.ssh/known_hosts

      - name: Check private host connectivity
        run: |
          ssh private-ec2 'docker compose version'

      - name: Copy application to private host
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env*' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            release/ "private-ec2:${APP_PATH}/"

      - name: Upload production environment file
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          printf '%s\n' "$APP_ENV_FILE" | ssh private-ec2 \
            "-n mkdir -p '${APP_PATH}' && -n tee '${APP_PATH}/.env' > /dev/null && sudo -n chown '${DEPLOY_USER}:${DEPLOY_USER}' '${APP_PATH}/.env' && sudo -n chmod 600 '${APP_PATH}/.env'"

      - name: Rebuild and restart application
        run: |
          ssh private-ec2 \
            "cd '${APP_PATH}' && docker compose up -d --build --remove-orphans && docker compose ps"

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key
