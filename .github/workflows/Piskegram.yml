name: Deploy PiskeGram to private EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PATH: /home/ubuntu/Sample-socialmedia-app-test
  DEPLOY_USER: ubuntu

jobs:
  validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          test -n "$APP_ENV_FILE"
          printf '%s\n' "$APP_ENV_FILE" > .env
          chmod 600 .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: piskegram-app:ci
          load: true
          cache-from: type=gha,scope=piskegram-app
          cache-to: type=gha,mode=max,scope=piskegram-app

      - name: Package validated source
        run: |
          tar --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            -czf "$RUNNER_TEMP/piskegram-source.tar.gz" .
          cp "$RUNNER_TEMP/piskegram-source.tar.gz" ./piskegram-source.tar.gz

      - name: Upload validated source artifact
        uses: actions/upload-artifact@v4
        with:
          name: piskegram-source-${{ github.sha }}
          path: piskegram-source.tar.gz
          retention-days: 7

  deploy:
    name: Deploy through bastion
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download validated source artifact
        uses: actions/download-artifact@v4
        with:
          name: piskegram-source-${{ github.sha }}

      - name: Extract validated source
        run: |
          mkdir -p release
          tar -xzf piskegram-source.tar.gz -C release
          cd release
          test -f docker-compose.yml
          test -f Dockerfile

      - name: Create deployment environment file
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          test -n "$APP_ENV_FILE"
          printf '%s\n' "$APP_ENV_FILE" > .env
          chmod 600 .env

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install --yes rsync

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$BASTION_HOST"
          test -n "$PRIVATE_HOST"
          BASTION_HOST="$(printf '%s' "$BASTION_HOST" | tr -d '\r\n')"
          PRIVATE_HOST="$(printf '%s' "$PRIVATE_HOST" | tr -d '\r\n')"
          for host in "$BASTION_HOST" "$PRIVATE_HOST"; do
            if [[ ! "$host" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ && ! "$host" =~ ^[A-Za-z0-9.-]+$ ]]; then
              echo "Host secret values must contain only an IPv4 address or DNS hostname. Set the secret name separately; do not include BASTION_HOST=, ssh, ubuntu@, URLs, quotes, ports, or labels."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g; s/\r$//' > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -4 -T 10 -H "$BASTION_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${BASTION_HOST}" \
            "ssh-keyscan -4 -T 10 -H '${PRIVATE_HOST}'" >> ~/.ssh/known_hosts

      - name: Check private host connectivity
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
        run: |
          BASTION_HOST="$(printf '%s' "$BASTION_HOST" | tr -d '\r\n')"
          PRIVATE_HOST="$(printf '%s' "$PRIVATE_HOST" | tr -d '\r\n')"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -J "${DEPLOY_USER}@${BASTION_HOST}" \
            "${DEPLOY_USER}@${PRIVATE_HOST}" \
            'docker compose version'

      - name: Copy application to private host
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
        run: |
          BASTION_HOST="$(printf '%s' "$BASTION_HOST" | tr -d '\r\n')"
          PRIVATE_HOST="$(printf '%s' "$PRIVATE_HOST" | tr -d '\r\n')"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env*' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -J ${DEPLOY_USER}@${BASTION_HOST}" \
            release/ "${DEPLOY_USER}@${PRIVATE_HOST}:${APP_PATH}/"

      - name: Upload production environment file
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          BASTION_HOST="$(printf '%s' "$BASTION_HOST" | tr -d '\r\n')"
          PRIVATE_HOST="$(printf '%s' "$PRIVATE_HOST" | tr -d '\r\n')"
          printf '%s\n' "$APP_ENV_FILE" | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -J "${DEPLOY_USER}@${BASTION_HOST}" \
            "${DEPLOY_USER}@${PRIVATE_HOST}" \
            "umask 077 && mkdir -p '${APP_PATH}' && cat > '${APP_PATH}/.env'"

      - name: Rebuild and restart application
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          PRIVATE_HOST: ${{ secrets.PRIVATE_HOST }}
        run: |
          BASTION_HOST="$(printf '%s' "$BASTION_HOST" | tr -d '\r\n')"
          PRIVATE_HOST="$(printf '%s' "$PRIVATE_HOST" | tr -d '\r\n')"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -J "${DEPLOY_USER}@${BASTION_HOST}" \
            "${DEPLOY_USER}@${PRIVATE_HOST}" \
            "cd '${APP_PATH}' && docker compose up -d --build --remove-orphans && docker compose ps"

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/deploy_key
