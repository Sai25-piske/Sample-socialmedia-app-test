services:

  mysql:
    image: mysql:8.0

    container_name: piskegram-mysql

    restart: unless-stopped

    # Use a fresh DB volume so old credentials from previous Compose setups cannot block signup.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-piskegram}
      MYSQL_USER: ${MYSQL_USER:-piskegram_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-piskegram-password}

    volumes:
      - bitlagram_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - piskegram-network


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: piskegram-app

    restart: unless-stopped

    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-development-secret-key-change-me}
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-piskegram}
      MYSQL_USER: ${MYSQL_USER:-piskegram_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-piskegram-password}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-uploads}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      LOCAL_UPLOAD_DIR: /app/uploads

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5000:5000"

    networks:
      - piskegram-network


volumes:

  bitlagram_mysql_data:

  uploads_data:


networks:

  piskegram-network:
    driver: bridge
