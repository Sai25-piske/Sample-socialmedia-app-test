services:

  mysql:
    image: mysql:8.0

    container_name: piskegram-mysql

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - piskegram-network


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: piskegram-app

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5000:5000"

    networks:
      - piskegram-network


volumes:

  mysql_data:


networks:

  piskegram-network:
    driver: bridge
