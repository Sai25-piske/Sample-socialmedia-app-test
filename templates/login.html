{% extends "base.html" %}

{% block title %}
Login • Bitla Gram
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            Bitla Gram
        </div>

        <p class="auth-subtitle">
            Share moments. Connect with people.
        </p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="primary-btn"
            >
                Log in
            </button>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <p class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Sign up
            </a>

        </p>

    </div>

</div>

{% endblock %}
