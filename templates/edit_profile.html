{% extends "base.html" %}

{% block title %}
Edit Profile • PiskeGram
{% endblock %}

{% block content %}

<div class="upload-page">

    <div class="upload-card">

        <div class="upload-header">

            <h1>
                Edit profile
            </h1>

            <p>
                Update your profile information.
            </p>

        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <label class="profile-upload-label">
                Profile picture
                <span>JPG, PNG, GIF or WEBP · up to 15 MB</span>
                <input
                    type="file"
                    name="profile_pic"
                    accept="image/*"
                    onchange="previewProfileImage(event)"
                >
            </label>

            <div id="profile-image-preview" class="profile-image-preview">
                {% if user.profile_url %}
                <img src="{{ user.profile_url }}" alt="Current profile picture">
                {% endif %}
            </div>


            <label>
                Bio
            </label>

            <textarea
                name="bio"
                maxlength="255"
                placeholder="Tell people about yourself..."
            >{{ user.bio }}</textarea>


            <button
                type="submit"
                class="primary-btn"
            >
                Save changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
