{% extends "base.html" %}

{% block title %}
Create Account • PiskeGram
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            PiskeGram
        </div>

        <p class="auth-subtitle">
            Create an account and start sharing.
        </p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="primary-btn"
            >
                Sign up
            </button>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <p class="auth-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Log in
            </a>

        </p>

    </div>

</div>

{% endblock %}
